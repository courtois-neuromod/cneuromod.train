[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cneuromod.train"
description = "Reproducible training, evaluation, and benchmarking of machine-learning models on Courtois NeuroMod datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Courtois NeuroMod" },
]
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/courtois-neuromod/cneuromod.train"
Repository = "https://github.com/courtois-neuromod/cneuromod.train"
Issues = "https://github.com/courtois-neuromod/cneuromod.train/issues"

[tool.hatch.version]
path = "src/cneuromod/train/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cneuromod"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
