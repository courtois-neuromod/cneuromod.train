[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cneuromod.train"
description = "Reproducible training, evaluation, and benchmarking of machine-learning models on Courtois NeuroMod datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Courtois NeuroMod" },
]
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
# CNeuroMod data layer (NeuralSet Study classes); not on PyPI yet. Marie's
# active development happens on the marie_dev branch (main is a stale initial
# commit), and marie_dev tracks the current neuralset/neuralfetch API.
# The Meta FAIR stack moves fast: the bounds mark the range our drift tests
# (tests/test_compat.py) are verified against — bump only after those pass.
# Downloading data additionally requires git-annex and S3 credentials, and
# constructing a Study clones its DataLad repos on first use.
data = [
    "neuralfetch-cneuromod @ git+https://github.com/courtois-neuromod/neuralfetch-cneuromod.git@marie_dev",
    "neuralset>=0.3,<0.4",
    "neuralfetch>=0.3,<0.4",
    "datalad",  # hard import in neuralfetch-cneuromod (marie_dev)
    "h5py",  # pre-extracted timeseries are HDF5
    "moviepy",  # required by neuralset's Video event type (movie datasets)
]

[project.urls]
Homepage = "https://github.com/courtois-neuromod/cneuromod.train"
Repository = "https://github.com/courtois-neuromod/cneuromod.train"
Issues = "https://github.com/courtois-neuromod/cneuromod.train/issues"

[tool.hatch.version]
path = "src/cneuromod/train/__init__.py"

[tool.hatch.metadata]
# The `data` extra points at a GitHub repo (neuralfetch-cneuromod is not on
# PyPI yet). Direct references are fine as long as we don't publish to PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cneuromod"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Optional data-layer packages; not installed in the default CI environment,
# and nibabel/pandas ship no type information.
module = ["neuralfetch_cneuromod.*", "nibabel.*", "pandas.*", "numpy.*", "h5py.*", "datalad.*", "exca.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
